name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Install Android SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip
          mkdir -p $HOME/.android/sdk
          export ANDROID_SDK_ROOT=$HOME/.android/sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          # Normalize layout: some zips extract to cmdline-tools/cmdline-tools
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools"
          else
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            # move contents into latest if not already present
            if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
              mv "$ANDROID_SDK_ROOT/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" 2>/dev/null || true
            fi
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-31" "build-tools;33.0.2"
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Restore .NET workloads
        run: |
          # Restore workloads defined by the SDK/manifest. Avoid installing a platform-specific 'maui' workload name.
          dotnet workload restore

      - name: Publish APK
        run: |
          dotnet publish AiAgent.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64 -o ./artifacts/android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ginger-android-apk
          path: artifacts/android
